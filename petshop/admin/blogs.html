<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage Blogs for Samaria Pet Shop. Create and edit SEO friendly blog posts.">
  <meta name="robots" content="noindex, nofollow">
  <title>Manage Blogs | Samaria Admin Portal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --red: #B91C1C;
      --red-dark: #7F1D1D;
      --gold: #D4A445;
      --gold-light: #F59E0B;
      --black: #0B0B0C;
      --black-light: #121214;
      --cream: #FDFBF7;
      --cream-dark: #F4EFEB;
      --white: #FFFFFF;
      --sidebar: #121214;
      --text: #1F2937;
      --text-soft: #6B7280;
      --radius: 12px;
      --radius-lg: 18px;
      --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ====== SIDEBAR ====== */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(212, 164, 69, 0.12);
      z-index: 10;
      position: relative;
    }

    .sidebar-brand {
      padding: 30px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .sidebar-brand img {
      height: 64px;
      background: var(--white);
      padding: 8px 18px;
      border-radius: var(--radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: var(--transition);
    }

    .sidebar-brand img:hover {
      transform: scale(1.03);
    }

    .sidebar-nav {
      flex: 1;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 14px 16px;
      color: #9CA3AF;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: var(--radius);
      font-size: 0.94rem;
      font-weight: 500;
      transition: var(--transition);
      border-left: 3px solid transparent;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      border-left-color: var(--gold);
    }

    .nav-item i {
      font-size: 1.1rem;
      transition: var(--transition);
    }

    .nav-item:hover i, .nav-item.active i {
      color: var(--gold);
    }

    .logout-btn {
      padding: 18px 24px;
      color: #F87171;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 600;
      font-size: 0.92rem;
      transition: var(--transition);
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.05);
      color: #EF4444;
    }

    /* ====== MAIN AREA ====== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 40px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1.5px solid var(--cream-dark);
      padding-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--black);
      letter-spacing: -0.01em;
    }

    .header h1 span {
      background: linear-gradient(to right, var(--red), var(--red-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--white);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(212, 164, 69, 0.12);
      box-shadow: var(--shadow);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .user-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--black);
    }

    /* ====== CARDS ====== */
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(212, 164, 69, 0.08);
    }

    .card h2 {
      margin-top: 0;
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--red);
      margin-bottom: 30px;
      border-bottom: 1.5px solid var(--cream-dark);
      padding-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ====== TABLES ====== */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--cream-dark);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      text-align: left;
    }

    th, td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--cream-dark);
    }

    th {
      background: var(--cream);
      color: var(--text-soft);
      font-weight: 700;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    td {
      font-size: 0.94rem;
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .slug-pill {
      font-family: monospace;
      background: var(--cream);
      color: var(--gold-light);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid rgba(212,164,69,0.1);
    }

    .btn-sm {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--cream-dark);
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      background: var(--white);
      color: var(--text);
    }

    .btn-sm:hover {
      background: var(--cream);
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-delete {
      color: var(--red);
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.05);
      border-color: var(--red);
      color: var(--red);
    }

    /* ====== MODAL ====== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 11, 12, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      width: 90%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: var(--radius-lg);
      padding: 40px;
      position: relative;
      border: 1px solid rgba(212, 164, 69, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
    }

    .modal-close {
      position: absolute;
      top: 25px;
      right: 25px;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--text-soft);
      border: none;
      background: none;
      transition: var(--transition);
    }

    .modal-close:hover {
      color: var(--red);
      transform: rotate(90deg);
    }

    .modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--black);
      margin: 0 0 25px;
      border-bottom: 1.5px solid var(--cream-dark);
      padding-bottom: 15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--cream);
      border: 1.5px solid var(--cream-dark);
      border-radius: var(--radius);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: var(--transition);
      box-sizing: border-box;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 12px rgba(212, 164, 69, 0.08);
    }

    .form-group textarea {
      height: 180px;
      resize: vertical;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      color: #fff;
      border: none;
      padding: 14px 30px;
      border-radius: var(--radius);
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(185, 28, 28, 0.2);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(185, 28, 28, 0.3);
      background: linear-gradient(135deg, #D32F2F 0%, var(--red) 100%);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-soft);
      font-size: 0.95rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <link rel="icon" type="image/png" href="../images/logo.png" />
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <img src="../images/logo.png" alt="Samaria Admin">
  </div>
  <div class="sidebar-nav">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard Overview</a>
    <a href="add-pet.html" class="nav-item"><i class="fas fa-plus-circle"></i> Add New Pet</a>
    <a href="inventory.html" class="nav-item"><i class="fas fa-list"></i> Manage Inventory</a>
    <a href="blogs.html" class="nav-item active"><i class="fas fa-blog"></i> Manage Blogs</a>
    <a href="enquiries.html" class="nav-item"><i class="fas fa-envelope"></i> View Enquiries</a>
    <a href="settings.html" class="nav-item"><i class="fas fa-shield-alt"></i> Security Settings</a>
  </div>
  <a onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Secure Logout</a>
</div>

<div class="main-content">
  <div class="header">
    <h1><span>Blog Management</span></h1>
    <div class="user-profile-badge">
      <div class="user-avatar">A</div>
      <div class="user-name">Administrator</div>
    </div>
  </div>

  <div class="card">
    <h2>
      <span><i class="fas fa-file-alt"></i> Published Articles & Guides</span>
      <button class="btn-sm" style="background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%); color:#fff; border:none; padding:10px 18px; box-shadow:0 4px 10px rgba(185,28,28,0.15);" onclick="openBlogModal()"><i class="fas fa-plus"></i> Compose Article</button>
    </h2>
    
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Published Date</th>
            <th>Article Title</th>
            <th>URL Routing Slug</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="blogTableBody">
          <tr>
            <td colspan="4" class="empty-state"><i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Querying articles data store...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Blog Modal -->
<div class="modal" id="blogModal" onclick="handleOverlayClick(event)">
  <div class="modal-content">
    <button class="modal-close" onclick="closeBlogModal()">&times;</button>
    <h2 id="modalTitle">Create New Blog Post</h2>
    <form id="blogForm" onsubmit="saveBlog(event)">
      <input type="hidden" id="blogId">
      <div class="form-group">
        <label for="blogTitle">Blog Title</label>
        <input type="text" id="blogTitle" placeholder="e.g. 5 Tips for Potty Training a Puppy" required onkeyup="generateSlug(this.value)">
      </div>
      <div class="form-group">
        <label for="blogSlug">URL Slug (Auto-generated)</label>
        <input type="text" id="blogSlug" placeholder="5-tips-for-potty-training-a-puppy" required>
      </div>
      <div class="form-group">
        <label for="blogImage">Featured Image Location / URL</label>
        <input type="text" id="blogImage" placeholder="e.g. images/blog1.png">
      </div>
      <div class="form-group">
        <label for="blogContent">Article Content (HTML formatting fully supported)</label>
        <textarea id="blogContent" required placeholder="Write your gorgeous article contents here..."></textarea>
      </div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="form-group">
          <label for="blogMeta">Meta Description (SEO Optimization)</label>
          <input type="text" id="blogMeta" placeholder="Short description for Google snippet results">
        </div>
        <div class="form-group">
          <label for="blogKeywords">Keywords (SEO Tagging)</label>
          <input type="text" id="blogKeywords" placeholder="e.g. pet care, puppies, dog training">
        </div>
      </div>
      <button type="submit" class="btn-submit">Publish Article Listing <i class="fas fa-paper-plane" style="margin-left: 6px;"></i></button>
    </form>
  </div>
</div>

<script>
  if(!sessionStorage.getItem('adminToken')) window.location.href = 'index.html';

  function logout() {
    sessionStorage.removeItem('adminToken');
    window.location.href = 'index.html';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('blogModal')) closeBlogModal();
  }

  function generateSlug(text) {
    const slug = text.toLowerCase()
      .replace(/[^\w ]+/g, '')
      .replace(/ +/g, '-');
    document.getElementById('blogSlug').value = slug;
  }

  function openBlogModal(blog = null) {
    const modal = document.getElementById('blogModal');
    const form = document.getElementById('blogForm');
    document.getElementById('modalTitle').textContent = blog ? 'Edit Blog Post Specification' : 'Compose Beautiful Blog Post';
    
    if (blog) {
      document.getElementById('blogId').value = blog.id;
      document.getElementById('blogTitle').value = blog.title;
      document.getElementById('blogSlug').value = blog.slug;
      document.getElementById('blogImage').value = blog.image;
      document.getElementById('blogContent').value = blog.content;
      document.getElementById('blogMeta').value = blog.meta_description;
      document.getElementById('blogKeywords').value = blog.keywords;
    } else {
      form.reset();
      document.getElementById('blogId').value = '';
    }
    
    modal.classList.add('open');
  }

  function closeBlogModal() {
    document.getElementById('blogModal').classList.remove('open');
  }

  function loadBlogs() {
    fetch('../api/get_blogs.php')
      .then(res => res.json())
      .then(blogs => {
        const tbody = document.getElementById('blogTableBody');
        tbody.innerHTML = '';
        
        if (blogs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="empty-state"><i class="fas fa-info-circle" style="margin-right:8px;"></i> No published articles. Compose one now!</td>
            </tr>
          `;
          return;
        }

        blogs.forEach(blog => {
          const date = new Date(blog.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong style="color:var(--text-soft);">${date}</strong></td>
            <td><strong style="color:var(--black); font-size:1.02rem;">${blog.title}</strong></td>
            <td><span class="slug-pill">/${blog.slug}</span></td>
            <td style="text-align: right;">
              <div class="action-btn-group" style="justify-content: flex-end;">
                <button class="btn-sm" onclick='editBlog(${JSON.stringify(blog).replace(/'/g, "&apos;")})'><i class="fas fa-pencil-alt"></i> Edit</button>
                <button class="btn-sm btn-delete" onclick="deleteBlog(${blog.id})"><i class="fas fa-trash-alt"></i> Delete</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(() => {
        const tbody = document.getElementById('blogTableBody');
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty-state" style="color:var(--red);"><i class="fas fa-exclamation-triangle" style="margin-right:8px;"></i> Network failure. Ensure XAMPP or your database is online.</td>
          </tr>
        `;
      });
  }

  function editBlog(blog) {
    openBlogModal(blog);
  }

  function saveBlog(e) {
    e.preventDefault();
    const data = {
      id: document.getElementById('blogId').value,
      title: document.getElementById('blogTitle').value,
      slug: document.getElementById('blogSlug').value,
      image: document.getElementById('blogImage').value,
      content: document.getElementById('blogContent').value,
      meta_description: document.getElementById('blogMeta').value,
      keywords: document.getElementById('blogKeywords').value
    };

    fetch('../api/save_blog.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        alert('✓ Blog article successfully secured and published!');
        closeBlogModal();
        loadBlogs();
      } else {
        alert('Error: ' + data.message);
      }
    })
    .catch(() => {
      alert('Error updating article. Check database status.');
    });
  }

  function deleteBlog(id) {
    if (confirm('Are you absolutely sure you want to permanently delete this blog post? This action is irreversible.')) {
      fetch('../api/delete_blog.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          loadBlogs();
        } else {
          alert('Error: ' + data.message);
        }
      });
    }
  }

  document.addEventListener('DOMContentLoaded', loadBlogs);
</script>
</body>
</html>
