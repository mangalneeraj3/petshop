<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Admin Login | Samaria Pet Shop</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --red: #B91C1C;
      --red-dark: #7F1D1D;
      --gold: #D4A445;
      --gold-light: #F59E0B;
      --black: #0B0B0C;
      --black-light: #18181B;
      --cream: #FDFBF7;
      --text: #F3F4F6;
      --text-soft: #9CA3AF;
      --radius: 12px;
      --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at center, #1E0707 0%, var(--black) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Glowing Lights */
    .glow-1 {
      position: absolute;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(185, 28, 28, 0.12) 0%, transparent 75%);
      pointer-events: none;
      z-index: 1;
    }

    .glow-2 {
      position: absolute;
      bottom: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.06) 0%, transparent 75%);
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Particles Background */
    #particle-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-particle {
      position: absolute;
      bottom: -40px;
      color: rgba(212, 164, 69, 0.12);
      pointer-events: none;
      animation: floatUp 12s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
    }

    .login-container {
      background: rgba(24, 24, 27, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 164, 69, 0.15);
      width: 100%;
      max-width: 440px;
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      z-index: 2;
      position: relative;
      overflow: hidden;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo img {
      height: 85px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
      transition: var(--transition);
    }

    .login-logo img:hover {
      transform: scale(1.05);
    }

    .login-container h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      margin: 0 0 8px;
      background: linear-gradient(to right, #FFFFFF, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-container p.subtitle {
      font-size: 0.9rem;
      color: var(--text-soft);
      text-align: center;
      margin: 0 0 35px;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .input-group {
      margin-bottom: 24px;
      position: relative;
    }

    .input-group label {
      display: block;
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      color: var(--gold);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.prefix-icon {
      position: absolute;
      left: 16px;
      color: var(--text-soft);
      font-size: 1rem;
      transition: var(--transition);
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      background: rgba(11, 11, 12, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.98rem;
      outline: none;
      transition: var(--transition);
      box-sizing: border-box;
    }

    .input-wrapper input:focus {
      border-color: var(--gold);
      background: rgba(24, 24, 27, 0.9);
      box-shadow: 0 0 15px rgba(212, 164, 69, 0.15);
    }

    .input-wrapper input:focus + i.prefix-icon {
      color: var(--gold);
    }

    .toggle-pass {
      position: absolute;
      right: 16px;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .toggle-pass:hover {
      color: var(--gold);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      color: #fff;
      padding: 15px;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(185, 28, 28, 0.25);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(185, 28, 28, 0.35);
      background: linear-gradient(135deg, #D32F2F 0%, var(--red) 100%);
    }

    .btn:active {
      transform: translateY(0);
    }

    .error {
      color: #EF4444;
      font-size: 0.85rem;
      margin-top: 15px;
      text-align: center;
      display: none;
      background: rgba(239, 68, 68, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .success {
      color: #10B981;
      font-size: 0.85rem;
      margin-top: 15px;
      text-align: center;
      display: none;
      background: rgba(16, 185, 129, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .form-switch-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-soft);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .form-switch-link:hover {
      color: var(--gold);
    }

    .security-badge {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-soft);
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 20px;
    }

    .security-badge i {
      color: var(--gold);
    }

    /* Animation classes */
    .fade-slide-in {
      animation: fadeSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeSlideIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="icon" type="image/png" href="../images/logo.png" />
</head>

<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div id="particle-container"></div>

  <div class="login-container fade-slide-in">
    <div class="login-logo">
      <img src="../images/logo.png" alt="Samaria Pet Shop">
    </div>
    
    <h2>Admin Portal</h2>
    <p class="subtitle">ENTERPRISE SECURITY ACCESS</p>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" required autocomplete="off" placeholder="e.g. admin">
          <i class="fas fa-user prefix-icon"></i>
        </div>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" required placeholder="e.g. password">
          <i class="fas fa-lock prefix-icon"></i>
          <i class="fas fa-eye toggle-pass" onclick="togglePasswordVisibility('password', this)"></i>
        </div>
      </div>
      <button type="submit" class="btn">Secure Login <i class="fas fa-shield-alt"></i></button>
      <div class="error" id="errorMsg">Invalid Credentials</div>
      <a href="#" id="showResetForm" class="form-switch-link">Forgot Password?</a>
    </form>

    <!-- Reset Form -->
    <form id="resetForm" style="display: none;">
      <div class="input-group">
        <label for="resetUsername">Username</label>
        <div class="input-wrapper">
          <input type="text" id="resetUsername" required autocomplete="off" placeholder="Enter your username">
          <i class="fas fa-user prefix-icon"></i>
        </div>
      </div>
      <div class="input-group">
        <label for="resetPassword">New Password</label>
        <div class="input-wrapper">
          <input type="password" id="resetPassword" required placeholder="Enter new password">
          <i class="fas fa-key prefix-icon"></i>
          <i class="fas fa-eye toggle-pass" onclick="togglePasswordVisibility('resetPassword', this)"></i>
        </div>
      </div>
      <button type="submit" class="btn">Reset Password <i class="fas fa-key"></i></button>
      <div class="error" id="resetErrorMsg"></div>
      <div class="success" id="resetSuccessMsg"></div>
      <a href="#" id="showLoginForm" class="form-switch-link"><i class="fas fa-arrow-left" style="font-size:0.8rem; margin-right:5px;"></i> Back to Login</a>
    </form>

    <div class="security-badge">
      <i class="fas fa-fingerprint"></i> SECURED BY END-TO-END CRYPTO PROTOCOL
    </div>
  </div>

  <script>
    // Particles System
    const particleContainer = document.getElementById('particle-container');
    const particlePool = ['<i class="fa-solid fa-paw"></i>', '<i class="fa-solid fa-shield-halved"></i>'];
    
    function createParticle() {
      if (document.hidden) return;
      const element = document.createElement('div');
      element.className = 'floating-particle';
      element.innerHTML = particlePool[Math.floor(Math.random() * particlePool.length)];
      
      const size = Math.random() * 12 + 10;
      const left = Math.random() * 100;
      const duration = Math.random() * 8 + 8;
      const delay = Math.random() * 2;
      
      element.style.fontSize = `${size}px`;
      element.style.left = `${left}%`;
      element.style.animationDuration = `${duration}s`;
      element.style.animationDelay = `${delay}s`;
      
      particleContainer.appendChild(element);
      
      setTimeout(() => {
        element.remove();
      }, (duration + delay) * 1000);
    }
    
    for(let i=0; i<8; i++) {
      createParticle();
    }
    setInterval(createParticle, 2000);

    // Password Visiblity Toggler
    function togglePasswordVisibility(fieldId, icon) {
      const field = document.getElementById(fieldId);
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'fas fa-eye-slash toggle-pass';
      } else {
        field.type = 'password';
        icon.className = 'fas fa-eye toggle-pass';
      }
    }

    // Forms Switchers
    document.getElementById('showResetForm').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('resetForm').style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    });

    document.getElementById('showLoginForm').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('resetErrorMsg').style.display = 'none';
      document.getElementById('resetSuccessMsg').style.display = 'none';
    });

    // Login Form Processing
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const err = document.getElementById('errorMsg');
      
      err.style.display = 'none';

      fetch('../api/login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          sessionStorage.setItem('adminToken', data.token);
          window.location.href = 'dashboard.html';
        } else {
          err.textContent = data.message;
          err.style.display = 'block';
        }
      })
      .catch(() => {
        err.textContent = "Network error. Make sure XAMPP or your backend server is active.";
        err.style.display = 'block';
      });
    });

    // Reset Form Processing
    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('resetUsername').value;
      const p = document.getElementById('resetPassword').value;
      const err = document.getElementById('resetErrorMsg');
      const succ = document.getElementById('resetSuccessMsg');

      err.style.display = 'none';
      succ.style.display = 'none';

      fetch('../api/reset_password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, new_password: p })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          succ.textContent = "✓ Password reset successfully! You can now log in.";
          succ.style.display = 'block';
          document.getElementById('resetForm').reset();
        } else {
          err.textContent = "✗ Error: " + data.message;
          err.style.display = 'block';
        }
      })
      .catch(() => {
        err.textContent = "✗ Connection error. Make sure XAMPP database server is active.";
        err.style.display = 'block';
      });
    });
  </script>
</body>
</html>
