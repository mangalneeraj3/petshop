<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure Admin Enquiries for Samaria Pet Shop.">
  <meta name="robots" content="noindex, nofollow">
  <title>Customer Enquiries | Samaria Admin Portal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --red: #B91C1C;
      --red-dark: #7F1D1D;
      --gold: #D4A445;
      --gold-light: #F59E0B;
      --black: #0B0B0C;
      --black-light: #121214;
      --cream: #FDFBF7;
      --cream-dark: #F4EFEB;
      --white: #FFFFFF;
      --sidebar: #121214;
      --text: #1F2937;
      --text-soft: #6B7280;
      --radius: 12px;
      --radius-lg: 18px;
      --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ====== SIDEBAR ====== */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(212, 164, 69, 0.12);
      z-index: 10;
      position: relative;
    }

    .sidebar-brand {
      padding: 30px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .sidebar-brand img {
      height: 64px;
      background: var(--white);
      padding: 8px 18px;
      border-radius: var(--radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: var(--transition);
    }

    .sidebar-brand img:hover {
      transform: scale(1.03);
    }

    .sidebar-nav {
      flex: 1;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 14px 16px;
      color: #9CA3AF;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: var(--radius);
      font-size: 0.94rem;
      font-weight: 500;
      transition: var(--transition);
      border-left: 3px solid transparent;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      border-left-color: var(--gold);
    }

    .nav-item i {
      font-size: 1.1rem;
      transition: var(--transition);
    }

    .nav-item:hover i, .nav-item.active i {
      color: var(--gold);
    }

    .logout-btn {
      padding: 18px 24px;
      color: #F87171;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 600;
      font-size: 0.92rem;
      transition: var(--transition);
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.05);
      color: #EF4444;
    }

    /* ====== MAIN AREA ====== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 40px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1.5px solid var(--cream-dark);
      padding-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--black);
      letter-spacing: -0.01em;
    }

    .header h1 span {
      background: linear-gradient(to right, var(--red), var(--red-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--white);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(212, 164, 69, 0.12);
      box-shadow: var(--shadow);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .user-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--black);
    }

    /* ====== CARDS ====== */
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(212, 164, 69, 0.08);
    }

    .card h2 {
      margin-top: 0;
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--red);
      margin-bottom: 30px;
      border-bottom: 1.5px solid var(--cream-dark);
      padding-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ====== TABLES ====== */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--cream-dark);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      text-align: left;
    }

    th, td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--cream-dark);
    }

    th {
      background: var(--cream);
      color: var(--text-soft);
      font-weight: 700;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    td {
      font-size: 0.94rem;
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .phone-pill {
      font-family: monospace;
      font-weight: 700;
      color: var(--text);
      background: var(--cream);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--cream-dark);
    }

    /* Badge Customization */
    .badge {
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-new {
      background: rgba(245, 158, 11, 0.1);
      color: #D97706;
    }

    .badge-contacted {
      background: rgba(59, 130, 246, 0.1);
      color: #2563EB;
    }

    .badge-completed {
      background: rgba(16, 185, 129, 0.1);
      color: #059669;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-soft);
      font-size: 0.95rem;
    }

    .btn-whatsapp {
      background: rgba(37, 211, 102, 0.1);
      color: #128C7E;
      border: 1px solid rgba(37, 211, 102, 0.25);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      transition: var(--transition);
    }

    .btn-whatsapp:hover {
      background: #25D366;
      color: #fff;
      border-color: #25D366;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
    }
  </style>
  <link rel="icon" type="image/png" href="../images/logo.png" />
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <img src="../images/logo.png" alt="Samaria Admin">
  </div>
  <div class="sidebar-nav">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard Overview</a>
    <a href="add-pet.html" class="nav-item"><i class="fas fa-plus-circle"></i> Add New Pet</a>
    <a href="inventory.html" class="nav-item"><i class="fas fa-list"></i> Manage Inventory</a>
    <a href="blogs.html" class="nav-item"><i class="fas fa-blog"></i> Manage Blogs</a>
    <a href="enquiries.html" class="nav-item active"><i class="fas fa-envelope"></i> View Enquiries</a>
    <a href="settings.html" class="nav-item"><i class="fas fa-shield-alt"></i> Security Settings</a>
  </div>
  <a onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Secure Logout</a>
</div>

<div class="main-content">
  <div class="header">
    <h1><span>Customer Enquiries</span></h1>
    <div class="user-profile-badge">
      <div class="user-avatar">A</div>
      <div class="user-name">Administrator</div>
    </div>
  </div>

  <div class="card">
    <h2><span><i class="fas fa-inbox"></i> Inbox Pipeline</span></h2>
    
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Reception Date</th>
            <th>Client Name</th>
            <th>Interested Listing</th>
            <th>Phone Contact</th>
            <th>Pipeline Status</th>
            <th style="text-align: right;">Instant Outreach</th>
          </tr>
        </thead>
        <tbody id="enquiryBody">
          <tr>
            <td colspan="6" class="empty-state"><i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Querying customer communications...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  if(!sessionStorage.getItem('adminToken')) window.location.href = 'index.html';
  function logout() { sessionStorage.removeItem('adminToken'); window.location.href = 'index.html'; }

  function loadEnquiries() {
    fetch('../api/enquiries.php')
      .then(res => res.json())
      .then(enqs => {
        const tbody = document.getElementById('enquiryBody');
        tbody.innerHTML = '';
        
        if (enqs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="empty-state"><i class="fas fa-info-circle" style="margin-right:8px;"></i> No customer enquiries found in database.</td>
            </tr>
          `;
          return;
        }

        enqs.forEach(e => {
          const tr = document.createElement('tr');
          const cleanPhone = e.phone.replace(/[^\d]/g, '');
          
          // Render status pill matching pipeline state
          let statusBadgeClass = 'badge-new';
          if (e.status.toLowerCase() === 'contacted' || e.status.toLowerCase() === 'in progress') {
            statusBadgeClass = 'badge-contacted';
          } else if (e.status.toLowerCase() === 'adopted' || e.status.toLowerCase() === 'completed') {
            statusBadgeClass = 'badge-completed';
          }
          
          // Pre-filled WhatsApp message URL
          const waMessage = `Hello ${e.customerName}! 🐾 This is Samaria Pet Shop. We received your request about: *${e.petName}*.\n\nHow can we assist you further today?`;
          const waUrl = `https://wa.me/${cleanPhone.startsWith('91') ? cleanPhone : '91' + cleanPhone}?text=${encodeURIComponent(waMessage)}`;

          tr.innerHTML = `
            <td><strong style="color:var(--text-soft);">${e.date}</strong></td>
            <td><strong style="color:var(--black); font-size:1.02rem;">${e.customerName}</strong></td>
            <td><span style="font-weight:600; color:var(--red-dark);"><i class="fas fa-paw" style="font-size:0.8rem; margin-right:4px;"></i> ${e.petName}</span></td>
            <td><span class="phone-pill">${e.phone}</span></td>
            <td><span class="badge ${statusBadgeClass}">${e.status}</span></td>
            <td style="text-align: right;">
              <a href="${waUrl}" target="_blank" class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i> Chat Client
              </a>
            </td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(() => {
        const tbody = document.getElementById('enquiryBody');
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state" style="color:var(--red);"><i class="fas fa-exclamation-triangle" style="margin-right:8px;"></i> Network failure. Ensure XAMPP or your database is online.</td>
          </tr>
        `;
      });
  }
  loadEnquiries();
</script>
</body>
</html>
