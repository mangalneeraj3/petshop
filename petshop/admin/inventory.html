<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure Admin Inventory for Samaria Pet Shop.">
  <meta name="robots" content="noindex, nofollow">
  <title>Manage Pet Inventory | Samaria Admin Portal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --red: #B91C1C;
      --red-dark: #7F1D1D;
      --gold: #D4A445;
      --gold-light: #F59E0B;
      --black: #0B0B0C;
      --black-light: #121214;
      --cream: #FDFBF7;
      --cream-dark: #F4EFEB;
      --white: #FFFFFF;
      --sidebar: #121214;
      --text: #1F2937;
      --text-soft: #6B7280;
      --radius: 12px;
      --radius-lg: 18px;
      --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ====== SIDEBAR ====== */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(212, 164, 69, 0.12);
      z-index: 10;
      position: relative;
    }

    .sidebar-brand {
      padding: 30px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .sidebar-brand img {
      height: 64px;
      background: var(--white);
      padding: 8px 18px;
      border-radius: var(--radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: var(--transition);
    }

    .sidebar-brand img:hover {
      transform: scale(1.03);
    }

    .sidebar-nav {
      flex: 1;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 14px 16px;
      color: #9CA3AF;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: var(--radius);
      font-size: 0.94rem;
      font-weight: 500;
      transition: var(--transition);
      border-left: 3px solid transparent;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      border-left-color: var(--gold);
    }

    .nav-item i {
      font-size: 1.1rem;
      transition: var(--transition);
    }

    .nav-item:hover i, .nav-item.active i {
      color: var(--gold);
    }

    .logout-btn {
      padding: 18px 24px;
      color: #F87171;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 600;
      font-size: 0.92rem;
      transition: var(--transition);
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.05);
      color: #EF4444;
    }

    /* ====== MAIN AREA ====== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 40px 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1.5px solid var(--cream-dark);
      padding-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--black);
      letter-spacing: -0.01em;
    }

    .header h1 span {
      background: linear-gradient(to right, var(--red), var(--red-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--white);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(212, 164, 69, 0.12);
      box-shadow: var(--shadow);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .user-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--black);
    }

    /* ====== CARDS ====== */
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(212, 164, 69, 0.08);
    }

    .card h2 {
      margin-top: 0;
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--red);
      margin-bottom: 30px;
      border-bottom: 1.5px solid var(--cream-dark);
      padding-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ====== TABLE ====== */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--cream-dark);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      text-align: left;
    }

    th, td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--cream-dark);
    }

    th {
      background: var(--cream);
      color: var(--text-soft);
      font-weight: 700;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    td {
      font-size: 0.94rem;
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .pet-thumbnail-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid var(--cream-dark);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .pet-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }

    tr:hover .pet-thumbnail {
      transform: scale(1.1);
    }

    .pet-id-pill {
      font-family: monospace;
      background: var(--cream);
      color: var(--red-dark);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* Category Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .badge-dogs { background: rgba(245, 158, 11, 0.1); color: #B45309; }
    .badge-cats { background: rgba(239, 68, 68, 0.1); color: #B91C1C; }
    .badge-birds { background: rgba(20, 184, 166, 0.1); color: #0F766E; }
    .badge-fish { background: rgba(59, 130, 246, 0.1); color: #1D4ED8; }
    .badge-other { background: rgba(139, 92, 246, 0.1); color: #6D28D9; }

    .badge-status {
      background: rgba(16, 185, 129, 0.1);
      color: #047857;
    }

    /* Actions */
    .action-btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-sm {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--cream-dark);
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      background: var(--white);
      color: var(--text);
    }

    .btn-sm:hover {
      background: var(--cream);
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-delete {
      color: var(--red);
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.05);
      border-color: var(--red);
      color: var(--red);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-soft);
      font-size: 0.95rem;
    }
  </style>
  <link rel="icon" type="image/png" href="../images/logo.png" />
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <img src="../images/logo.png" alt="Samaria Admin">
  </div>
  <div class="sidebar-nav">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard Overview</a>
    <a href="add-pet.html" class="nav-item"><i class="fas fa-plus-circle"></i> Add New Pet</a>
    <a href="inventory.html" class="nav-item active"><i class="fas fa-list"></i> Manage Inventory</a>
    <a href="blogs.html" class="nav-item"><i class="fas fa-blog"></i> Manage Blogs</a>
    <a href="enquiries.html" class="nav-item"><i class="fas fa-envelope"></i> View Enquiries</a>
    <a href="settings.html" class="nav-item"><i class="fas fa-shield-alt"></i> Security Settings</a>
  </div>
  <a onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Secure Logout</a>
</div>

<div class="main-content">
  <div class="header">
    <h1><span>Manage Inventory</span></h1>
    <div class="user-profile-badge">
      <div class="user-avatar">A</div>
      <div class="user-name">Administrator</div>
    </div>
  </div>

  <div class="card">
    <h2>
      <span><i class="fas fa-boxes"></i> Active Catalog Records</span>
      <a href="add-pet.html" class="btn-sm" style="background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%); color:#fff; border:none; padding:10px 18px; box-shadow:0 4px 10px rgba(185,28,28,0.15);"><i class="fas fa-plus"></i> New Listing</a>
    </h2>
    
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Pet ID</th>
            <th>Portrait</th>
            <th>Breed / Name</th>
            <th>Category</th>
            <th>Gender / Age</th>
            <th>Listing Status</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryBody">
          <tr>
            <td colspan="7" class="empty-state"><i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Querying catalog data store...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  if(!sessionStorage.getItem('adminToken')) window.location.href = 'index.html';
  function logout() { sessionStorage.removeItem('adminToken'); window.location.href = 'index.html'; }

  function loadInventory() {
    fetch('../api/get_pets.php')
      .then(res => res.json())
      .then(pets => {
        const tbody = document.getElementById('inventoryBody');
        tbody.innerHTML = '';
        
        if (pets.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="empty-state"><i class="fas fa-info-circle" style="margin-right:8px;"></i> No pets found. Click "New Listing" to add one!</td>
            </tr>
          `;
          return;
        }

        pets.forEach(p => {
          const tr = document.createElement('tr');
          const categoryClass = p.category ? `badge-${p.category}` : 'badge-other';
          
          tr.innerHTML = `
            <td><span class="pet-id-pill">#${p.pet_id}</span></td>
            <td>
              <div class="pet-thumbnail-wrap">
                <img src="${p.image || '../images/placeholder.png'}" class="pet-thumbnail" alt="${p.name}">
              </div>
            </td>
            <td><strong>${p.name}</strong></td>
            <td><span class="badge ${categoryClass}">${p.category}</span></td>
            <td><span style="font-weight:600; color:var(--text);">${p.gender}</span> · <span style="color:var(--text-soft); font-size:0.85rem;">${p.age}</span></td>
            <td><span class="badge badge-status">Active</span></td>
            <td style="text-align: right;">
              <div class="action-btn-group" style="justify-content: flex-end;">
                <button class="btn-sm" onclick="window.location.href='add-pet.html?edit=${p.pet_id}'"><i class="fas fa-pencil-alt"></i> Edit</button>
                <button class="btn-sm btn-delete" onclick="deletePet('${p.pet_id}')"><i class="fas fa-trash-alt"></i> Delete</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(() => {
        const tbody = document.getElementById('inventoryBody');
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="empty-state" style="color:var(--red);"><i class="fas fa-exclamation-triangle" style="margin-right:8px;"></i> Network failure. Ensure XAMPP or your database is online.</td>
          </tr>
        `;
      });
  }

  function deletePet(id) {
    if(confirm('Are you absolutely sure you want to permanently delete this pet listing? This action cannot be undone.')) {
      fetch('../api/delete_pet.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({id: id})
      })
      .then(res => res.json())
      .then(d => { 
        if(d.status === 'success') {
          loadInventory(); 
        } else {
          alert("Error: " + d.message);
        }
      });
    }
  }

  loadInventory();
</script>
</body>
</html>
